[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "civicbridge-ai"
version = "0.1.0"
description = "AI-powered Indian Government Benefits Navigator on Fetch.ai uAgents and ASI:One"
authors = [{ name = "Kushagra Tripathi" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uagents>=0.26.1",
    "uagents-core>=0.4.12",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
